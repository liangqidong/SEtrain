network_config:
  n_fft: 512
  hop_len: 256
  win_len: 512

DDP:
  world_size: 1

optimizer:
  lr: 0.001

scheduler:
  kwargs:
    warmup_steps: 25000
    decay_until_step: 250000
    max_lr: 1e-3
    min_lr: 1e-6

  update_interval: step  # [step, epoch]

FFT:
  n_fft: 512
  hop_length: 256
  win_length: 512

loss:
  n_fft: ${FFT.n_fft}
  hop_len: ${FFT.hop_length}
  win_len: ${FFT.win_length}
  compress_factor: 0.3
  eps: 1e-12
  lamda_ri: 30
  lamda_mag: 70

train_dataset: 
  length_in_seconds: 10
  num_data_tot: 5
  num_data_per_epoch: 5
  random_start_point: False
  train: True

train_dataloader: 
  batch_size: 2
  num_workers: 2
  drop_last: True
  pin_memory: True

validation_dataset: 
  length_in_seconds: 10
  random_start_point: False
  train: False

validation_dataloader:
  batch_size: 2
  num_workers: 2
  pin_memory: True

samplerate: 16000

trainer:
  epochs: 3
  save_checkpoint_interval: 1
  clip_grad_norm_value: 3.0
  exp_path: ./exp_gtcrn
  resume: False
  resume_datetime: 2024-12-31-14h28m
